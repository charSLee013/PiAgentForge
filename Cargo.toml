[workspace]
resolver = "2"
members = [
    "pi-ai-core",
    "pi-agent-core",
    "pi-tui-core",
    "pi-tui-app",
    "pi-core",
    "pi-cli",
    "pi",
    "pi-modes",
    "pi-model-catalog",
    "pi-oauth",
    "pi-provider-openai",
    "pi-provider-anthropic",
    "pi-provider-google",
    "pi-provider-mistral",
    "pi-provider-bedrock",
    "pi-extension-system",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["charslee <charslee@pi-to-rust.dev>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
globset = "0.4"
notify = "7"
serde_yaml = "0.9"
futures = "0.3"

